name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The extraction layer runs offline, but the harvest store is only meaningfully
    # tested against a real Postgres: upserts and the unique title index are exactly
    # what a fake would get wrong.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragtorio
          POSTGRES_PASSWORD: ragtorio
          POSTGRES_DB: ragtorio
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ragtorio -d ragtorio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Phase 5's four query templates are .cypher files. A test suite that skips
      # them because no graph is reachable would let a broken query merge.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ragtorio
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Typecheck
        run: mypy

      # No internet access is needed: every HTTP call is mocked with respx and the
      # wikitext fixtures are committed. The integration tests talk only to the
      # services above, and skip themselves if either is unreachable.
      - name: Create the test database
        run: |
          PGPASSWORD=ragtorio psql -h localhost -p 5433 -U ragtorio -d ragtorio \
            -c "CREATE DATABASE ragtorio_test"

      - name: Test
        run: pytest
        env:
          RAGTORIO_TEST_DSN: postgresql://ragtorio:ragtorio@localhost:5433/ragtorio_test
