[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtorio"
version = "0.1.0"
description = "Knowledge-graph and vector RAG over crafting-game wikis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "mwparserfromhell>=0.6",
    "neo4j>=5.0",
    "anthropic>=1,<2",
]

[project.optional-dependencies]
# The local embedding model, and the ~2GB of PyTorch behind it. Optional because
# only `ragtorio index build` needs it: the chunker, the store and the recall
# harness all run without it, so CI stays light and a clone stays cheap.
embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-PyYAML",
]

[project.scripts]
ragtorio = "ragtorio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragtorio = ["db/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["B008"]           # typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ragtorio"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Optional, and ships no stubs. Only index/embed.py imports it, lazily.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ragtorio --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: needs a live Postgres (docker compose up postgres)"]
pythonpath = ["src"]
